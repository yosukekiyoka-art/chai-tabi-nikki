<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チャイの旅日記 〜インドをめぐる、こころの旅〜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'MS Gothic', 'Noto Sans JP', monospace;
    overflow: hidden;
  }

  #bg {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 50% 60%, #1a1a3a 0%, #0a0a1a 70%);
  }

  /* Stars */
  .star {
    position: fixed; border-radius: 50%;
    background: white; animation: twinkle 3s infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.3; }
    to   { opacity: 1; }
  }

  #title-screen {
    position: relative; z-index: 1;
    text-align: center; padding: 20px;
    display: flex; flex-direction: column; align-items: center; gap: 32px;
  }

  #logo {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }

  #logo-main {
    font-size: clamp(32px, 6vw, 56px);
    color: #FFD700;
    text-shadow: 0 0 20px #FFD70088, 0 2px 0 #000;
    letter-spacing: 4px;
    animation: glow 2s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from { text-shadow: 0 0 10px #FFD70066, 0 2px 0 #000; }
    to   { text-shadow: 0 0 30px #FFD700CC, 0 0 60px #FF880044, 0 2px 0 #000; }
  }

  #logo-sub {
    font-size: clamp(12px, 2vw, 16px);
    color: #D4A84B;
    letter-spacing: 2px;
  }

  /* Chai character illustration (SVG pixel art) */
  #chai-walk {
    width: 96px; height: 96px;
    image-rendering: pixelated;
    animation: chai-walk 0.6s steps(2) infinite;
  }

  @keyframes chai-walk {
    0%   { transform: translateY(0); }
    50%  { transform: translateY(-4px); }
    100% { transform: translateY(0); }
  }

  #menu {
    display: flex; flex-direction: column; gap: 12px;
    min-width: 200px;
  }

  .menu-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(212,168,75,0.4);
    color: #FFD700;
    font-size: 18px;
    font-family: inherit;
    padding: 12px 32px;
    cursor: pointer;
    letter-spacing: 3px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .menu-btn::before {
    content: '▶';
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%);
    opacity: 0; transition: opacity 0.2s;
    font-size: 12px;
  }

  .menu-btn:hover {
    background: rgba(212,168,75,0.2);
    border-color: #FFD700;
    transform: translateX(4px);
  }

  .menu-btn:hover::before { opacity: 1; }
  .menu-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #version {
    position: fixed; bottom: 12px; right: 16px;
    color: rgba(255,255,255,0.3);
    font-size: 11px;
  }

  /* Floating India elements */
  .deco {
    position: fixed; font-size: 24px;
    animation: float 6s ease-in-out infinite;
    opacity: 0.4; pointer-events: none;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%       { transform: translateY(-12px) rotate(5deg); }
  }
</style>
</head>
<body>
<div id="bg"></div>

<div id="title-screen">
  <div id="logo">
    <div id="logo-main">チャイの旅日記</div>
    <div id="logo-sub">〜 インドをめぐる、こころの旅 〜</div>
  </div>

  <!-- Pixel art Chai character -->
  <canvas id="chai-canvas" width="64" height="64" style="image-rendering:pixelated;width:96px;height:96px;"></canvas>

  <div id="menu">
    <button class="menu-btn" onclick="startGame()">はじめる</button>
    <button class="menu-btn" id="btn-continue" onclick="continueGame()">つづきから</button>
    <button class="menu-btn" onclick="showSaveSelect()">そうさつ</button>
  </div>
</div>

<div class="deco" style="top:15%;left:8%;animation-delay:0s;">🪔</div>
<div class="deco" style="top:25%;right:10%;animation-delay:1s;">🌺</div>
<div class="deco" style="bottom:20%;left:12%;animation-delay:2s;">☕</div>
<div class="deco" style="bottom:30%;right:8%;animation-delay:0.5s;">🌊</div>
<div class="deco" style="top:60%;left:5%;animation-delay:1.5s;">🪴</div>

<div id="version">ver 2.1</div>

<script>
// Generate stars
const bg = document.getElementById('bg');
for (let i = 0; i < 80; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2 + 1;
  s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s;`;
  bg.appendChild(s);
}

// Draw simple Chai pixel art on canvas
const canvas = document.getElementById('chai-canvas');
const ctx = canvas.getContext('2d');

function drawChaiTitle(frame) {
  ctx.clearRect(0, 0, 64, 64);
  const legOff = frame % 2 === 0 ? 0 : 2;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(32, 58, 12, 3, 0, 0, Math.PI*2); ctx.fill();

  // Body
  ctx.fillStyle = '#8B5A2B';
  ctx.fillRect(22, 28, 20, 18);

  // Legs
  ctx.fillStyle = '#5C3D1E';
  ctx.fillRect(22, 44, 8, 10 + legOff);
  ctx.fillRect(34, 44, 8, 10 - legOff);

  // Head
  ctx.fillStyle = '#C4813A';
  ctx.fillRect(20, 10, 24, 20);

  // Hair
  ctx.fillStyle = '#1A0A00';
  ctx.fillRect(18, 8, 28, 10);
  ctx.fillRect(18, 10, 4, 12);
  ctx.fillRect(42, 10, 4, 12);

  // Eyes
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(24, 20, 6, 5);
  ctx.fillRect(34, 20, 6, 5);
  ctx.fillStyle = '#1A0A00';
  ctx.fillRect(25, 21, 4, 4);
  ctx.fillRect(35, 21, 4, 4);

  // Bag
  ctx.fillStyle = '#7A6550';
  ctx.fillRect(40, 28, 8, 10);
  ctx.fillStyle = '#5A4530';
  ctx.fillRect(40, 24, 2, 6);
}

let frame = 0;
setInterval(() => { drawChaiTitle(frame++); }, 300);

// Title BGM (Web Audio API, procedural)
let titleAudioStarted = false;
function startTitleBgm() {
  if (titleAudioStarted) return;
  titleAudioStarted = true;
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const master = ac.createGain();
    master.gain.value = 0.28;
    master.connect(ac.destination);

    // ドローン
    const droneFreqs = [146.83, 220, 293.66];
    droneFreqs.forEach((f, i) => {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = i === 0 ? 'sawtooth' : 'triangle';
      o.frequency.value = f;
      o.detune.value = i * 4;
      g.gain.value = 0.04;
      o.connect(g); g.connect(master);
      o.start();
    });

    // シンプルなラーガメロディ
    const notes = [293.66, 329.63, 369.99, 440, 493.88, 440, 369.99, 329.63];
    let idx = 0;
    function playNext() {
      const t = ac.currentTime;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'triangle';
      o.frequency.value = notes[idx % notes.length];
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.09, t + 0.08);
      g.gain.setValueAtTime(0.09, t + 0.7);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + 1.2);
      idx++;
      setTimeout(playNext, 1400);
    }
    setTimeout(playNext, 300);
  } catch(e) {}
}
document.addEventListener('click',      startTitleBgm, { once: true });
document.addEventListener('keydown',    startTitleBgm, { once: true });
document.addEventListener('touchstart', startTitleBgm, { once: true });

// Check for save data
function hasSaveData() {
  for (let i = 0; i < 3; i++) {
    if (localStorage.getItem(`chai_save_${i}`)) return true;
  }
  return !!localStorage.getItem('chai_autosave');
}

document.getElementById('btn-continue').disabled = !hasSaveData();

function startGame() {
  window.location.href = 'game.html?mode=new';
}

function continueGame() {
  window.location.href = 'game.html?mode=continue';
}

function showSaveSelect() {
  // Show save slots in an alert for simplicity, or redirect
  window.location.href = 'game.html?mode=load';
}
</script>
</body>
</html>
